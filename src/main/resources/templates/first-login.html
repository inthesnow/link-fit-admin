<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최초 로그인 - LinkOnFit Admin</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">

        <div class="logo-area">
            <img class="logo-brand" th:src="@{/image/logo_length.png}" alt="LINK ON FIT">
            <p class="logo-subtitle">최초 로그인 — 비밀번호 설정</p>
        </div>

        <div id="alertBox" class="error-box" style="display:none">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10
                         10-4.48 10-10S17.52 2 12 2zm1
                         15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            <span id="alertMsg"></span>
        </div>

        <p style="margin:0 0 16px;font-size:13px;color:var(--text-secondary,#8a93a3);line-height:1.5">
            지점코드 발급 시 사용한 기본 비밀번호를 계속 쓸 수 없습니다.<br>
            1차 비밀번호(로그인용)를 새로 정하고, 2차 비밀번호를 함께 만들어주세요.
        </p>

        <form id="firstLoginForm" class="login-form" onsubmit="submitFirstLogin(event)">

            <div class="field-group">
                <label for="currentPassword">현재 비밀번호</label>
                <div class="input-wrap">
                    <input type="password" id="currentPassword"
                           placeholder="지점코드 발급 시 받은 비밀번호" required autocomplete="current-password">
                </div>
            </div>

            <div class="field-group">
                <label for="newPassword">새 1차 비밀번호 (로그인용)</label>
                <div class="input-wrap">
                    <input type="password" id="newPassword"
                           placeholder="새 비밀번호" required autocomplete="new-password">
                </div>
                <span class="field-hint">최소 4자리 이상</span>
            </div>

            <div class="field-group">
                <label for="newPasswordConfirm">새 1차 비밀번호 확인</label>
                <div class="input-wrap">
                    <input type="password" id="newPasswordConfirm"
                           placeholder="새 비밀번호 확인" required autocomplete="new-password">
                </div>
            </div>

            <div class="field-group">
                <label for="newSecondPassword">2차 비밀번호</label>
                <div class="input-wrap">
                    <input type="password" id="newSecondPassword"
                           placeholder="영문+숫자+특수문자 조합" required autocomplete="new-password">
                </div>
                <span class="field-hint">영문, 숫자, 특수문자를 모두 포함해 최소 8자리 이상 (대소문자 구분 없음)</span>
            </div>

            <div class="field-group">
                <label for="newSecondPasswordConfirm">2차 비밀번호 확인</label>
                <div class="input-wrap">
                    <input type="password" id="newSecondPasswordConfirm"
                           placeholder="2차 비밀번호 확인" required autocomplete="new-password">
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-login">설정 완료</button>
        </form>

        <p class="footer-text">LinkOnFit Admin &copy; 2025</p>
    </div>
</div>

<script>
const SECOND_PASSWORD_PATTERN = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

async function submitFirstLogin(e) {
    e.preventDefault();

    const currentPassword       = document.getElementById('currentPassword').value;
    const newPassword           = document.getElementById('newPassword').value;
    const newPasswordConfirm    = document.getElementById('newPasswordConfirm').value;
    const newSecondPassword     = document.getElementById('newSecondPassword').value;
    const newSecondPasswordConfirm = document.getElementById('newSecondPasswordConfirm').value;
    const btn = document.getElementById('btnSubmit');

    if (newPassword.length < 4) {
        return showError('1차 비밀번호는 최소 4자리 이상이어야 합니다.');
    }
    if (newPassword !== newPasswordConfirm) {
        return showError('1차 비밀번호 확인이 일치하지 않습니다.');
    }
    if (!SECOND_PASSWORD_PATTERN.test(newSecondPassword)) {
        return showError('2차 비밀번호는 영문, 숫자, 특수문자를 모두 포함해 최소 8자리 이상이어야 합니다.');
    }
    if (newSecondPassword !== newSecondPasswordConfirm) {
        return showError('2차 비밀번호 확인이 일치하지 않습니다.');
    }

    btn.disabled = true;
    btn.textContent = '처리 중...';

    try {
        const res = await fetch('/api/auth/change-password-first', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ currentPassword, newPassword, newSecondPassword })
        });
        const json = await res.json().catch(() => null);

        if (json && json.success) {
            location.href = '/dashboard';
        } else {
            showError((json && json.message) || '설정에 실패했습니다.');
        }
    } catch (err) {
        showError('서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.');
    } finally {
        btn.disabled = false;
        btn.textContent = '설정 완료';
    }
}

function showError(msg) {
    const box = document.getElementById('alertBox');
    document.getElementById('alertMsg').textContent = msg;
    box.style.display = 'flex';
}
</script>
</body>
</html>
