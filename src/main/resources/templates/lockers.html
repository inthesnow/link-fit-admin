<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>링크온핏 CRM — 라커 관리</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .ticket-kpi { background:#fff; border:1px solid var(--border); border-radius:8px; padding:12px 20px; min-width:110px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.04); }
        .tkpi-v { font-size:22px; font-weight:700; color:var(--accent); }
        .tkpi-l { font-size:12px; color:var(--text-muted); margin-top:2px; }
        .member-result-item { padding: 8px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border); }
        .member-result-item:last-child { border-bottom: none; }
        .member-result-item:hover { background: var(--surface-up); }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside th:replace="~{fragments/sidebar :: sidebar('lockers')}"></aside>

<main class="main">
    <header class="main-header">
        <div class="header-left">
            <button class="mobile-menu-btn" onclick="openSidebar()">
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <h1 class="page-title">라커 관리</h1>
        </div>
        <div class="header-right">
            <button class="btn btn-secondary" id="zoneEditBtn" style="display:none" onclick="openEditZoneModal()">구역 설정</button>
            <button class="btn btn-primary" onclick="openCreateZoneModal()">+ 구역 추가</button>
        </div>
    </header>

    <div id="zoneTabs" style="display:flex;flex-wrap:wrap;border-bottom:1px solid var(--border);padding:0 24px"></div>

    <div id="emptyState" style="display:none;padding:60px 24px;text-align:center;color:var(--text-muted)">
        아직 구역이 없습니다.<br>
        <button class="btn btn-primary" style="margin-top:16px" onclick="openCreateZoneModal()">구역 추가하기</button>
    </div>

    <div id="zoneContent" style="display:none">
        <div style="display:flex;gap:12px;padding:16px 24px;flex-wrap:wrap;border-bottom:1px solid var(--border)" id="lockerSummary">
            <div class="ticket-kpi"><div class="tkpi-v" id="kpiTotal">-</div><div class="tkpi-l">전체 라커</div></div>
            <div class="ticket-kpi"><div class="tkpi-v" style="color:var(--accent)" id="kpiOccupied">-</div><div class="tkpi-l">배정중</div></div>
            <div class="ticket-kpi"><div class="tkpi-v" style="color:var(--text-muted)" id="kpiEmpty">-</div><div class="tkpi-l">비어있음</div></div>
        </div>

        <div class="pagination" id="lockerColPagination" style="border-bottom:1px solid var(--border)"></div>
        <div id="lockerGrid" class="locker-grid"></div>
        <div class="pagination" id="lockerPagination"></div>
    </div>
</main>

<!-- 구역 추가/설정 모달 -->
<div class="modal-overlay" id="layoutModal">
    <div class="modal" style="max-width:400px">
        <div class="modal-header">
            <span class="modal-title" id="layoutModalTitle">구역 추가</span>
            <button class="modal-close" onclick="closeLayoutModal()">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">구역 이름 *</label>
                <input type="text" class="form-input" id="layoutName" placeholder="예: 1층 남자라커">
            </div>
            <div class="form-group">
                <label class="form-label">총 라커 개수 *</label>
                <input type="number" class="form-input" id="layoutTotal" min="1" placeholder="예: 120">
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">가로 *</label>
                    <input type="number" class="form-input" id="layoutCols" min="1" placeholder="예: 12">
                </div>
                <div class="form-group">
                    <label class="form-label">세로 * <span style="color:var(--text-muted);font-size:11px">(최대 10)</span></label>
                    <input type="number" class="form-input" id="layoutRows" min="1" max="10" placeholder="예: 8">
                </div>
            </div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:4px">
                라커 번호는 1번부터 가로×세로 배치 순서로 자동 생성됩니다.<br>
                세로는 최대 10칸까지 설정할 수 있습니다.<br>
                이미 생성된 라커보다 적은 개수로는 줄일 수 없습니다.
            </div>
            <div id="layoutError" style="color:var(--error);font-size:12px;margin-top:8px;display:none"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="zoneDeleteBtn" style="display:none;background:var(--error);color:#fff" onclick="deleteZoneConfirm()">구역 삭제</button>
            <button class="btn btn-secondary" onclick="closeLayoutModal()">취소</button>
            <button class="btn btn-primary" onclick="saveLayout()">저장</button>
        </div>
    </div>
</div>

<!-- 라커 배정 모달 -->
<div class="modal-overlay" id="assignModal">
    <div class="modal" style="max-width:480px">
        <div class="modal-header">
            <span class="modal-title" id="assignModalTitle">라커 배정</span>
            <button class="modal-close" onclick="closeAssignModal()">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">회원 검색 *</label>
                <div style="display:flex;gap:8px">
                    <input type="text" class="form-input" id="assignMemberKeyword" placeholder="회원명 입력 후 검색"
                           onkeyup="if(event.key==='Enter')searchAssignMember()">
                    <button class="btn btn-secondary" style="white-space:nowrap" onclick="searchAssignMember()">검색</button>
                </div>
                <div id="assignMemberResults" style="margin-top:6px;border:1px solid var(--border);border-radius:6px;max-height:160px;overflow-y:auto;display:none"></div>
                <div id="assignMemberSelected" style="margin-top:6px;padding:8px 12px;background:var(--surface-up);border-radius:6px;font-size:13px;display:none"></div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">개월</label>
                    <input type="number" class="form-input" id="assignMonths" min="0" value="1">
                </div>
                <div class="form-group">
                    <label class="form-label">일</label>
                    <input type="number" class="form-input" id="assignDays" min="0" value="0">
                </div>
                <div class="form-group">
                    <label class="form-label">금액</label>
                    <input type="number" class="form-input" id="assignPrice" min="0" value="0">
                </div>
                <div class="form-group">
                    <label class="form-label">할인금액</label>
                    <input type="number" class="form-input" id="assignDiscount" min="0" value="0" onchange="syncAssignPaidAmount()">
                </div>
                <div class="form-group">
                    <label class="form-label">납부액 *</label>
                    <input type="number" class="form-input" id="assignPaidAmount" min="0" value="0">
                </div>
                <div class="form-group">
                    <label class="form-label">시작일 *</label>
                    <input type="date" class="form-input" id="assignStart">
                </div>
                <div class="form-group full">
                    <label class="form-label">결제수단</label>
                    <select class="form-select" id="assignPaymentMethod"></select>
                </div>
                <div class="form-group full">
                    <label class="form-label">메모</label>
                    <input type="text" class="form-input" id="assignMemo" placeholder="메모 입력...">
                </div>
            </div>
            <div id="assignError" style="color:var(--error);font-size:12px;margin-top:8px;display:none"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeAssignModal()">취소</button>
            <button class="btn btn-primary" onclick="submitAssign()">배정</button>
        </div>
    </div>
</div>

<!-- 배정 정보 / 해제 모달 -->
<div class="modal-overlay" id="occupiedModal">
    <div class="modal" style="max-width:360px">
        <div class="modal-header">
            <span class="modal-title">라커 정보</span>
            <button class="modal-close" onclick="closeOccupiedModal()">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
        <div class="modal-body" id="occupiedBody"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeOccupiedModal()">닫기</button>
            <button class="btn btn-primary" style="background:var(--error)" onclick="releaseLocker()">해제</button>
        </div>
    </div>
</div>

<script>
// 그리드는 한 화면에 가로 20칸 x 세로 20칸까지만 보여주고, 그 이상은 각 축을 별도로
// 페이지네이션한다(가로 페이지 x 세로 페이지 타일 방식). 라커 총 개수가 실제로는
// 수백 개 수준이라 전체 목록을 한 번에 받아와 화면에서만 타일을 잘라 보여준다.
const TILE = 20;
let rowPage = 0;
let colPage = 0;
let layoutRowsCount = 0;
let layoutColsCount = 0;
let allLockers = [];
let lockerByPos = new Map(); // `${row}_${col}` -> locker
let zones = [];
let selectedZoneId = null;
let editingZoneId = null; // 모달 대상: null=구역 추가, 값 있으면 해당 구역 설정
let assignTargetLockerId = null;
let assignTargetMemberId = null;
let occupiedTarget = null; // { membershipId, lockerNumber }

function csrfHeaders(extra) { return Object.assign({ 'Content-Type': 'application/json' }, extra); }
function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function loadZones() {
    const res  = await fetch('/api/lockers/zones');
    const json = await res.json();
    zones = json.data || [];

    if (!zones.length) {
        selectedZoneId = null;
        document.getElementById('zoneTabs').innerHTML = '';
        document.getElementById('emptyState').style.display = '';
        document.getElementById('zoneContent').style.display = 'none';
        document.getElementById('zoneEditBtn').style.display = 'none';
        return;
    }

    if (!selectedZoneId || !zones.some(z => z.id === selectedZoneId)) {
        selectedZoneId = zones[0].id;
    }
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('zoneContent').style.display = '';
    document.getElementById('zoneEditBtn').style.display = '';
    renderZoneTabs();
    await selectZone(selectedZoneId);
}

function renderZoneTabs() {
    document.getElementById('zoneTabs').innerHTML = zones.map(z =>
        `<button class="page-tab${z.id === selectedZoneId ? ' active' : ''}" onclick="selectZone(${z.id})">${escHtml(z.name)}</button>`
    ).join('');
}

async function selectZone(zoneId) {
    selectedZoneId = zoneId;
    rowPage = 0;
    colPage = 0;
    renderZoneTabs();
    const zone = zones.find(z => z.id === zoneId);
    if (zone) {
        layoutRowsCount = zone.rowsCount;
        layoutColsCount = zone.colsCount;
    }
    await loadGrid();
}

async function loadGrid() {
    if (!selectedZoneId) return;
    const res  = await fetch(`/api/lockers?zoneId=${selectedZoneId}`);
    const json = await res.json();
    const data = json.data || {};
    allLockers = data.lockers || [];
    const total = data.total || 0;
    const occupied = data.occupied || 0;
    layoutRowsCount = data.rowsCount || layoutRowsCount;
    layoutColsCount = data.colsCount || layoutColsCount;

    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiOccupied').textContent = occupied;
    document.getElementById('kpiEmpty').textContent = total - occupied;

    lockerByPos = new Map();
    allLockers.forEach(l => {
        const idx = l.lockerNumber - 1;
        const row = Math.floor(idx / layoutColsCount);
        const col = idx % layoutColsCount;
        lockerByPos.set(row + '_' + col, l);
    });

    renderGrid();
}

function renderGrid() {
    const rowStart = rowPage * TILE;
    const rowEnd   = Math.min(rowStart + TILE, layoutRowsCount);
    const colStart = colPage * TILE;
    const colEnd   = Math.min(colStart + TILE, layoutColsCount);
    const colSpan  = Math.max(colEnd - colStart, 1);

    const grid = document.getElementById('lockerGrid');
    grid.style.gridTemplateColumns = `repeat(${colSpan}, minmax(70px, 1fr))`;

    let html = '';
    for (let r = rowStart; r < rowEnd; r++) {
        for (let c = colStart; c < colEnd; c++) {
            const l = lockerByPos.get(r + '_' + c);
            if (!l) { html += `<div></div>`; continue; }
            if (l.membershipId) {
                html += `<div class="locker-cell occupied" onclick="openOccupiedCell(${l.id})">
                    <span class="locker-num">#${l.lockerNumber}</span>
                    <span class="locker-name">${escHtml(l.memberName || l.memberId)}</span>
                    <span class="locker-period">${l.startDate || '-'} ~ ${l.endDate || '-'}</span>
                </div>`;
            } else {
                html += `<div class="locker-cell empty" onclick="openAssignCell(${l.id}, ${l.lockerNumber})">
                    <span class="locker-num">#${l.lockerNumber}</span>
                </div>`;
            }
        }
    }
    grid.innerHTML = html;

    renderTilePagination('lockerPagination', Math.ceil(layoutRowsCount / TILE), rowPage,
        i => { rowPage = i; renderGrid(); }, null);
    renderTilePagination('lockerColPagination', Math.ceil(layoutColsCount / TILE), colPage,
        i => { colPage = i; renderGrid(); }, '가로 페이지');
}

function renderTilePagination(elId, totalPages, page, onClickFn, label) {
    const el = document.getElementById(elId);
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    const btns = Array.from({length: totalPages}, (_, i) =>
        `<button class="page-btn${i === page ? ' active' : ''}" onclick="(${onClickFn})(${i})">${i+1}</button>`
    ).join('');
    el.innerHTML = (label ? `<span style="font-size:12px;color:var(--text-muted);margin-right:8px">${label}</span>` : '') + btns;
}

// ── 구역 추가/설정 모달 ──────────────────────────────────
function openCreateZoneModal() {
    editingZoneId = null;
    document.getElementById('layoutModalTitle').textContent = '구역 추가';
    document.getElementById('layoutName').value  = '';
    document.getElementById('layoutTotal').value = '';
    document.getElementById('layoutRows').value  = '';
    document.getElementById('layoutCols').value  = '';
    document.getElementById('zoneDeleteBtn').style.display = 'none';
    document.getElementById('layoutError').style.display = 'none';
    document.getElementById('layoutModal').classList.add('open');
}

function openEditZoneModal() {
    const zone = zones.find(z => z.id === selectedZoneId);
    if (!zone) return;
    editingZoneId = zone.id;
    document.getElementById('layoutModalTitle').textContent = '구역 설정';
    document.getElementById('layoutName').value  = zone.name;
    document.getElementById('layoutTotal').value = zone.totalCount;
    document.getElementById('layoutRows').value  = zone.rowsCount;
    document.getElementById('layoutCols').value  = zone.colsCount;
    document.getElementById('zoneDeleteBtn').style.display = '';
    document.getElementById('layoutError').style.display = 'none';
    document.getElementById('layoutModal').classList.add('open');
}

function closeLayoutModal() { document.getElementById('layoutModal').classList.remove('open'); }

async function saveLayout() {
    const name        = document.getElementById('layoutName').value.trim();
    const totalCount  = parseInt(document.getElementById('layoutTotal').value) || 0;
    const rowsCount   = parseInt(document.getElementById('layoutRows').value) || 0;
    const colsCount   = parseInt(document.getElementById('layoutCols').value) || 0;
    const body = { name, totalCount, rowsCount, colsCount };

    const res = editingZoneId
        ? await fetch(`/api/lockers/zones/${editingZoneId}`, { method: 'PUT', headers: csrfHeaders(), body: JSON.stringify(body) })
        : await fetch('/api/lockers/zones', { method: 'POST', headers: csrfHeaders(), body: JSON.stringify(body) });
    const json = await res.json();
    if (!json.success) {
        const errEl = document.getElementById('layoutError');
        errEl.textContent = json.message || '저장에 실패했습니다.';
        errEl.style.display = '';
        return;
    }
    if (!editingZoneId && json.data && json.data.id) {
        selectedZoneId = json.data.id;
    }
    closeLayoutModal();
    loadZones();
}

async function deleteZoneConfirm() {
    if (!editingZoneId) return;
    const zone = zones.find(z => z.id === editingZoneId);
    if (!confirm(`'${zone ? zone.name : ''}' 구역을 삭제하시겠습니까? 생성된 라커도 함께 삭제됩니다.`)) return;
    const res  = await fetch(`/api/lockers/zones/${editingZoneId}`, { method: 'DELETE', headers: csrfHeaders() });
    const json = await res.json();
    if (!json.success) {
        const errEl = document.getElementById('layoutError');
        errEl.textContent = json.message || '삭제에 실패했습니다.';
        errEl.style.display = '';
        return;
    }
    selectedZoneId = null;
    closeLayoutModal();
    loadZones();
}

// ── 배정 모달 ────────────────────────────────────────────
let paymentMethodCatalog = [];
async function loadPaymentMethods() {
    try {
        const res  = await fetch('/api/payment-methods');
        const json = await res.json();
        paymentMethodCatalog = json.data || [];
    } catch (e) {}
}
function renderPaymentMethodSelect() {
    const sel = document.getElementById('assignPaymentMethod');
    sel.innerHTML = paymentMethodCatalog.map(pm => `<option value="${escHtml(pm.name)}">${escHtml(pm.name)}</option>`).join('');
}

function openAssignCell(lockerId, lockerNumber) {
    assignTargetLockerId = lockerId;
    assignTargetMemberId = null;
    document.getElementById('assignModalTitle').textContent = `라커 #${lockerNumber} 배정`;
    document.getElementById('assignMemberKeyword').value = '';
    document.getElementById('assignMemberResults').style.display = 'none';
    document.getElementById('assignMemberSelected').style.display = 'none';
    document.getElementById('assignMonths').value = 1;
    document.getElementById('assignDays').value = 0;
    document.getElementById('assignPrice').value = 0;
    document.getElementById('assignDiscount').value = 0;
    document.getElementById('assignPaidAmount').value = 0;
    document.getElementById('assignStart').value = new Date().toISOString().slice(0, 10);
    document.getElementById('assignMemo').value = '';
    document.getElementById('assignError').style.display = 'none';
    renderPaymentMethodSelect();
    document.getElementById('assignModal').classList.add('open');
}
function closeAssignModal() { document.getElementById('assignModal').classList.remove('open'); }

async function searchAssignMember() {
    const kw = document.getElementById('assignMemberKeyword').value.trim();
    if (!kw) return;
    const res  = await fetch(`/api/members?keyword=${encodeURIComponent(kw)}&page=0&size=10`);
    const json = await res.json();
    const list = json.data?.members || [];
    const el = document.getElementById('assignMemberResults');
    if (!list.length) {
        el.innerHTML = `<div style="padding:10px 12px;font-size:13px;color:var(--text-muted)">검색 결과 없음</div>`;
    } else {
        el.innerHTML = list.map(m => `
            <div class="member-result-item" onclick="selectAssignMember('${m.id}','${escHtml(m.name||m.id)}')">
                ${escHtml(m.name || m.id)}
                ${m.phone ? `<span style="color:var(--text-muted);margin-left:8px;font-size:12px">${m.phone}</span>` : ''}
            </div>`).join('');
    }
    el.style.display = '';
}
function selectAssignMember(id, name) {
    assignTargetMemberId = id;
    const sel = document.getElementById('assignMemberSelected');
    sel.textContent = name;
    sel.style.display = '';
    document.getElementById('assignMemberResults').style.display = 'none';
}
function syncAssignPaidAmount() {
    const price = parseInt(document.getElementById('assignPrice').value) || 0;
    const discount = parseInt(document.getElementById('assignDiscount').value) || 0;
    document.getElementById('assignPaidAmount').value = Math.max(price - discount, 0);
}

async function submitAssign() {
    const errEl = document.getElementById('assignError');
    errEl.style.display = 'none';
    if (!assignTargetMemberId) { errEl.textContent = '배정할 회원을 선택해주세요.'; errEl.style.display = ''; return; }
    const startDate = document.getElementById('assignStart').value;
    if (!startDate) { errEl.textContent = '시작일을 입력해주세요.'; errEl.style.display = ''; return; }
    const body = {
        memberId: assignTargetMemberId,
        durationMonths: parseInt(document.getElementById('assignMonths').value) || 0,
        durationDays: parseInt(document.getElementById('assignDays').value) || 0,
        price: parseInt(document.getElementById('assignPrice').value) || 0,
        discountAmount: parseInt(document.getElementById('assignDiscount').value) || 0,
        paidAmount: parseInt(document.getElementById('assignPaidAmount').value) || 0,
        startDate,
        paymentMethod: document.getElementById('assignPaymentMethod').value,
        memo: document.getElementById('assignMemo').value.trim(),
    };
    const res  = await fetch(`/api/lockers/${assignTargetLockerId}/assign`, {
        method: 'POST', headers: csrfHeaders(), body: JSON.stringify(body)
    });
    const json = await res.json();
    if (!json.success) { errEl.textContent = json.message || '배정에 실패했습니다.'; errEl.style.display = ''; return; }
    closeAssignModal();
    loadGrid();
}

// ── 배정 정보 / 해제 모달 ────────────────────────────────
function openOccupiedCell(lockerId) {
    const locker = allLockers.find(l => l.id === lockerId);
    if (!locker) return;
    occupiedTarget = { membershipId: locker.membershipId, lockerNumber: locker.lockerNumber };
    document.getElementById('occupiedBody').innerHTML = `
        <div class="form-group"><label class="form-label">라커 번호</label><div>#${locker.lockerNumber}</div></div>
        <div class="form-group"><label class="form-label">회원</label><div>${escHtml(locker.memberName || locker.memberId)}</div></div>
        <div class="form-group"><label class="form-label">기간</label><div>${locker.startDate || '-'} ~ ${locker.endDate || '-'}</div></div>
    `;
    document.getElementById('occupiedModal').classList.add('open');
}
function closeOccupiedModal() { document.getElementById('occupiedModal').classList.remove('open'); }

async function releaseLocker() {
    if (!occupiedTarget) return;
    if (!confirm(`라커 #${occupiedTarget.lockerNumber} 배정을 해제하시겠습니까?`)) return;
    await fetch(`/api/memberships/${occupiedTarget.membershipId}`, { method: 'DELETE', headers: csrfHeaders() });
    closeOccupiedModal();
    loadGrid();
}

function openSidebar() {
    document.querySelector('.sidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebar() {
    document.querySelector('.sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
}

loadPaymentMethods();
loadZones();
</script>
</body>
</html>
