<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>링크온핏 CRM — 만료 및 예정 회원 관리</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside th:replace="~{fragments/sidebar :: sidebar('reregistration')}"></aside>

<main class="main">
    <header class="main-header">
        <div class="header-left">
            <button class="mobile-menu-btn" onclick="openSidebar()">
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <h1 class="page-title">만료 및 예정 회원 관리</h1>
        </div>
        <div class="header-right">
            <button class="btn btn-secondary" onclick="exportList()" style="font-size:12px">
                <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                엑셀 내보내기
            </button>
            <button class="btn btn-secondary" onclick="runAutoClassify()" id="classifyBtn">
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                자동 분류 실행
            </button>
        </div>
    </header>

    <!-- 요약 카드 -->
    <div style="display:flex;gap:12px;padding:16px 24px;flex-wrap:wrap" id="summaryCards">
        <div class="summary-card" id="sc-target"><div class="sc-val">-</div><div class="sc-label">대상자</div></div>
        <div class="summary-card warning" id="sc-expiring"><div class="sc-val">-</div><div class="sc-label">예정자</div></div>
        <div class="summary-card error" id="sc-expired"><div class="sc-val">-</div><div class="sc-label">만료</div></div>
    </div>

    <!-- 필터 -->
    <div class="search-bar">
        <select class="filter-select" id="expiryFilter" onchange="currentPage=0;loadList()">
            <option value="">전체 만료상태</option>
            <option value="expiring">만료예정 (30일 이내)</option>
            <option value="expired">만료</option>
        </select>
        <div class="days-left-filter">
            <span class="days-left-label">만료일 기간</span>
            <input type="date" class="form-input" id="startDate" onchange="currentPage=0;loadList()">
            <span>~</span>
            <input type="date" class="form-input" id="endDate" onchange="currentPage=0;loadList()">
            <button class="btn btn-secondary" onclick="currentPage=0;loadList()">조회</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>회원명</th>
                    <th>전화번호</th>
                    <th>만료상태</th>
                    <th>만료일</th>
                    <th>등록상품</th>
                    <th>구독권정보</th>
                    <th>메모보기</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">로딩 중...</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination" id="pagination"></div>
</main>

<!-- 상세/편집 모달 -->
<div class="modal-overlay" id="detailModal">
    <div class="modal" style="max-width:500px">
        <div class="modal-header">
            <span class="modal-title">메모</span>
            <button class="modal-close" onclick="closeModal()">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <div style="display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap">
                <div>
                    <div style="font-size:11px;color:var(--text-muted)">회원</div>
                    <div id="dtMember" style="font-weight:600;margin-top:2px"></div>
                </div>
                <div>
                    <div style="font-size:11px;color:var(--text-muted)">사유</div>
                    <div id="dtReason" style="margin-top:2px"></div>
                </div>
                <div>
                    <div style="font-size:11px;color:var(--text-muted)">등록상품</div>
                    <div id="dtProduct" style="margin-top:2px"></div>
                </div>
                <div>
                    <div style="font-size:11px;color:var(--text-muted)">구독권정보</div>
                    <div id="dtTier" style="margin-top:2px"></div>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">메모 (특이사항, 상담 내용 등)</label>
                <div id="dtNoteList" style="max-height:240px;overflow-y:auto;margin-bottom:10px"></div>
                <div style="display:flex;gap:8px">
                    <textarea class="form-textarea" id="dtNoteInput" rows="2" placeholder="상담 내용, 특이사항 등..." style="flex:1;margin:0"></textarea>
                    <button class="btn btn-primary" style="align-self:flex-end" onclick="addDetailNote()">추가</button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">닫기</button>
        </div>
    </div>
</div>

<!-- 회원 상세정보 — 회원관리 페이지의 상세모달을 iframe으로 그대로 재사용(중복 구현 방지).
     페이지 이동 없이 이 화면 위에 그대로 뜨고, 닫으면 postMessage로 알려줘서 목록을 새로고침한다. -->
<div class="iframe-modal-overlay" id="memberDetailFrameWrap">
    <iframe id="memberDetailFrame" title="회원 상세정보"></iframe>
</div>

<style>
.iframe-modal-overlay { display: none; position: fixed; inset: 0; z-index: 300; }
.iframe-modal-overlay.open { display: block; }
.iframe-modal-overlay iframe { width: 100%; height: 100%; border: none; }
</style>

<style>
.summary-card {
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 22px; min-width: 90px; text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.summary-card.success .sc-val { color: var(--success); }
.summary-card.error   .sc-val { color: var(--error); }
.summary-card.warning .sc-val { color: var(--warning); }
.sc-val { font-size: 24px; font-weight: 700; color: var(--accent); }
.sc-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.days-left-filter { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: nowrap; }
.days-left-label { font-size: 13px; color: var(--text-secondary); margin-right: 2px; white-space: nowrap; flex-shrink: 0; }
.days-left-filter input[type="date"] { flex-shrink: 0; }
.crm-note-item { padding: 10px 12px; border-radius: 6px; background: var(--surface-up); margin-bottom: 8px; font-size: 13px; }
.crm-note-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
</style>

<script>
let currentPage = 0;
const pageSize  = 20;
let editingId   = null;

function csrfHeaders(extra) {
    return Object.assign({ 'Content-Type': 'application/json' }, extra);
}

function formatPhone(phone) {
    if (!phone) return '';
    const digits = String(phone).replace(/[^0-9]/g, '');
    if (digits.length === 11) return digits.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
    if (digits.length === 10) return digits.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
    return digits;
}

const reasonLabel = {
    membership_expiry: '이용권 만료 예정',
    pt_low:            'PT 잔여 부족',
    low_routine:       '루틴 이행률 저조',
    low_app_usage:     '앱 미접속',
    feedback_history:  '피드백 이력'
};
const reasonColor = {
    membership_expiry: 'var(--error)',
    pt_low:            'var(--warning)',
    low_routine:       'var(--warning)',
    low_app_usage:     'var(--text-muted)',
    feedback_history:  'var(--success)'
};
const tierLabel = { BASIC: '기본', LIGHT_FIT: '라이트핏', REGULAR_FIT: '레귤러핏', INTENSIVE_FIT: '인텐시브핏' };
const tierBadge = { BASIC: 'badge-pending', LIGHT_FIT: 'badge-active', REGULAR_FIT: 'badge-admin', INTENSIVE_FIT: 'badge-super' };

let currentItems = [];

// 만료예정: 오늘 <= 만료일 <= 오늘+30일. 만료: 만료일 경과 또는 이력 없음. 그 외(30일 초과 남음): 유효.
function expiryInfo(r) {
    if (!r.membershipEnd) {
        return { state: 'expired', label: '만료', detail: '이용권 없음' };
    }
    const end = new Date(r.membershipEnd + 'T00:00:00');
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const diffDays = Math.round((end - today) / 86400000);
    if (diffDays < 0)  return { state: 'expired',  label: '만료',     detail: `${-diffDays}일 경과` };
    if (diffDays <= 30) return { state: 'expiring', label: '만료예정', detail: `D-${diffDays}` };
    return { state: 'valid', label: '유효', detail: `D-${diffDays}` };
}
function expiryBadge(r) {
    const info = expiryInfo(r);
    const cls = info.state === 'expired' ? 'badge-expired' : info.state === 'expiring' ? 'badge-pending' : 'badge-active';
    return `<span class="badge ${cls}">${info.label}</span>`
         + `<div style="font-size:11px;color:var(--text-muted);margin-top:2px">${info.detail}</div>`;
}

async function loadSummary() {
    const res  = await fetch('/api/reregistration/membership-summary');
    const json = await res.json();
    if (!json.success) return;
    const d = json.data;
    document.getElementById('sc-target').querySelector('.sc-val').textContent   = d.target   ?? 0;
    document.getElementById('sc-expiring').querySelector('.sc-val').textContent = d.expiring ?? 0;
    document.getElementById('sc-expired').querySelector('.sc-val').textContent  = d.expired  ?? 0;
}

function exportList() {
    const expiryStatus = document.getElementById('expiryFilter').value;
    const startDate     = document.getElementById('startDate').value;
    const endDate        = document.getElementById('endDate').value;
    const params = new URLSearchParams();
    if (expiryStatus !== '') params.set('expiryStatus', expiryStatus);
    if (startDate !== '')    params.set('startDate', startDate);
    if (endDate !== '')      params.set('endDate', endDate);
    window.location.href = `/api/reregistration/export?${params}`;
}

async function loadList() {
    const expiryStatus = document.getElementById('expiryFilter').value;
    const startDate     = document.getElementById('startDate').value;
    const endDate        = document.getElementById('endDate').value;
    let url = `/api/reregistration?page=${currentPage}&size=${pageSize}`;
    if (expiryStatus !== '') url += `&expiryStatus=${encodeURIComponent(expiryStatus)}`;
    if (startDate !== '')    url += `&startDate=${encodeURIComponent(startDate)}`;
    if (endDate !== '')      url += `&endDate=${encodeURIComponent(endDate)}`;
    const res  = await fetch(url);
    const json = await res.json();
    if (!json.success) return;
    currentItems = json.data.items || [];
    renderTable(currentItems, json.data.total);
}

function renderTable(items, total) {
    const tbody = document.getElementById('tableBody');
    if (!items || !items.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">재등록 대상자가 없습니다.</td></tr>`;
        renderPagination(0);
        return;
    }
    tbody.innerHTML = items.map(r => `
        <tr onclick="openMemberDetail('${r.memberId}')" style="cursor:pointer">
            <td>${escHtml(r.memberName || r.memberId)}</td>
            <td>${formatPhone(r.memberPhone) || '-'}</td>
            <td>${expiryBadge(r)}</td>
            <td>${r.membershipEnd || '-'}</td>
            <td>${r.productName ? escHtml(r.productName) : '<span style="color:var(--text-muted)">-</span>'}</td>
            <td><span class="badge ${tierBadge[r.tier] || 'badge-pending'}">${tierLabel[r.tier] || r.tier || '-'}</span></td>
            <td>
                <button class="btn btn-secondary" style="padding:5px 10px;font-size:12px" onclick="event.stopPropagation();openDetail('${r.id}')">메모보기</button>
            </td>
        </tr>`).join('');
    renderPagination(total);
}

// 회원관리 페이지의 상세정보 모달을 그대로 재사용 — 중복 구현하지 않고 iframe으로 띄워서
// 이 페이지를 벗어나지 않고(주소창도 그대로) 해당 회원의 상세 모달만 보여준다.
// members.html은 embed=1일 때 사이드바/목록을 숨기고 상세모달만 자동으로 연다.
function openMemberDetail(memberId) {
    document.getElementById('memberDetailFrame').src = `/members?openId=${encodeURIComponent(memberId)}&embed=1`;
    document.getElementById('memberDetailFrameWrap').classList.add('open');
}

window.addEventListener('message', (e) => {
    if (e.origin !== window.location.origin) return;
    if (e.data === 'memberDetailModalClosed') {
        document.getElementById('memberDetailFrameWrap').classList.remove('open');
        document.getElementById('memberDetailFrame').src = 'about:blank';
        loadList();
        loadSummary();
    }
});

function renderPagination(total) {
    const totalPages = Math.ceil(total / pageSize);
    const pg = document.getElementById('pagination');
    if (totalPages <= 1) { pg.innerHTML = ''; return; }
    pg.innerHTML = Array.from({length: totalPages}, (_,i) =>
        `<button class="page-btn${i === currentPage ? ' active' : ''}" onclick="currentPage=${i};loadList()">${i+1}</button>`
    ).join('');
}

function openDetail(id) {
    const r = currentItems.find(x => x.id === id);
    if (!r) return;
    editingId = id;
    document.getElementById('dtMember').textContent  = r.memberName || r.memberId;
    document.getElementById('dtReason').textContent  = reasonLabel[r.reason] || r.reason || '-';
    document.getElementById('dtProduct').textContent = r.productName || '-';
    document.getElementById('dtTier').textContent    = tierLabel[r.tier] || r.tier || '-';
    document.getElementById('dtNoteInput').value = '';
    loadDetailNotes();
    document.getElementById('detailModal').classList.add('open');
}

function closeModal() {
    document.getElementById('detailModal').classList.remove('open');
    editingId = null;
}

// ── 메모(스택형) — 회원 메모와 동일한 방식으로 시간순으로 쌓인다 ──────
async function loadDetailNotes() {
    const res  = await fetch(`/api/reregistration/${editingId}/notes`);
    const json = await res.json();
    const list = document.getElementById('dtNoteList');
    if (!json.success || !json.data.length) {
        list.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:12px 0">등록된 메모가 없습니다.</div>';
        return;
    }
    list.innerHTML = json.data.map(n => `
        <div class="crm-note-item">
            <div>${escHtml(n.content)}</div>
            <div class="crm-note-meta">${n.authorName || '관리자'} · ${fmtDate(n.createdAt)}</div>
        </div>`).join('');
}

async function addDetailNote() {
    const content = document.getElementById('dtNoteInput').value.trim();
    if (!content) return;
    await fetch(`/api/reregistration/${editingId}/notes`, {
        method: 'POST', headers: csrfHeaders(), body: JSON.stringify({ content })
    });
    document.getElementById('dtNoteInput').value = '';
    loadDetailNotes();
}

async function runAutoClassify() {
    const btn = document.getElementById('classifyBtn');
    btn.disabled = true;
    btn.textContent = '분류 중...';
    try {
        const res  = await fetch('/api/reregistration/auto-classify', {
            method: 'POST', headers: csrfHeaders()
        });
        const json = await res.json();
        if (json.success) {
            alert(`자동 분류 완료: 신규 ${json.data.created}건 생성`);
            loadList();
            loadSummary();
        }
    } finally {
        btn.disabled = false;
        btn.textContent = '자동 분류 실행';
    }
}

function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(s) {
    if (!s) return '-';
    return String(s).replace('T',' ').substring(0,16);
}

function openSidebar() {
    document.querySelector('.sidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebar() {
    document.querySelector('.sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
}

loadSummary();
loadList();
</script>
</body>
</html>
