<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>링크온핏 CRM — 상품 등록 관리</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside th:replace="~{fragments/sidebar :: sidebar('products')}"></aside>

<main class="main">
    <header class="main-header">
        <div class="header-left">
            <button class="mobile-menu-btn" onclick="openSidebar()">
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <h1 class="page-title">상품 등록 관리</h1>
        </div>
        <div class="header-right">
            <button class="btn btn-primary" onclick="openModal()">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                상품 등록
            </button>
        </div>
    </header>

    <!-- 요약 카드 -->
    <div style="display:flex;gap:12px;padding:16px 24px;flex-wrap:wrap;border-bottom:1px solid var(--border)" id="productSummary">
        <div class="ticket-kpi"><div class="tkpi-v" id="kpiTotal">-</div><div class="tkpi-l">전체 상품</div></div>
        <div class="ticket-kpi"><div class="tkpi-v" style="color:var(--success)" id="kpiActive">-</div><div class="tkpi-l">판매중</div></div>
        <div class="ticket-kpi"><div class="tkpi-v" style="color:var(--text-muted)" id="kpiInactive">-</div><div class="tkpi-l">판매중지</div></div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>상품명</th>
                    <th>구성</th>
                    <th>가격</th>
                    <th>노출상태</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                <tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted)">로딩 중...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<!-- 상품 등록/수정 모달 -->
<div class="modal-overlay" id="productModal">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="modalTitle">상품 등록</span>
            <button class="modal-close" onclick="closeModal()">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-grid">
                <div class="form-group full">
                    <label class="form-label">상품명 *</label>
                    <input type="text" class="form-input" id="pName" placeholder="헬스 3개월 + PT 10회 패키지">
                </div>

                <div class="form-group full">
                    <label class="form-label">상품구성 * <span style="color:var(--text-muted);font-size:11px">(하나 이상 선택, 각 항목의 기간/횟수 지정)</span></label>
                    <div class="pkg-component-box">
                        <label class="pkg-component-row">
                            <input type="checkbox" id="cMembershipEnabled" onchange="toggleComponent('Membership')">
                            <span class="pkg-component-name">이용권</span>
                            <span class="pkg-component-fields">
                                개월 <input type="number" class="form-input" id="cMembershipMonths" min="0" placeholder="1" disabled>
                                일 <input type="number" class="form-input" id="cMembershipDays" min="0" placeholder="0" disabled>
                            </span>
                        </label>
                        <label class="pkg-component-row">
                            <input type="checkbox" id="cPtEnabled" onchange="toggleComponent('Pt')">
                            <span class="pkg-component-name">PT</span>
                            <span class="pkg-component-fields">
                                횟수(회) <input type="number" class="form-input" id="cPtSessionCount" min="0" placeholder="10" disabled>
                            </span>
                        </label>
                        <label class="pkg-component-row">
                            <input type="checkbox" id="cLockerEnabled" onchange="toggleComponent('Locker')">
                            <span class="pkg-component-name">락커</span>
                            <span class="pkg-component-fields">
                                개월 <input type="number" class="form-input" id="cLockerMonths" min="0" placeholder="1" disabled>
                                일 <input type="number" class="form-input" id="cLockerDays" min="0" placeholder="0" disabled>
                            </span>
                        </label>
                        <label class="pkg-component-row">
                            <input type="checkbox" id="cUniformEnabled" onchange="toggleComponent('Uniform')">
                            <span class="pkg-component-name">운동복</span>
                            <span class="pkg-component-fields">
                                개월 <input type="number" class="form-input" id="cUniformMonths" min="0" placeholder="1" disabled>
                                일 <input type="number" class="form-input" id="cUniformDays" min="0" placeholder="0" disabled>
                            </span>
                        </label>
                    </div>
                </div>

                <div class="form-group full">
                    <label class="form-label">상품금액 (원) *</label>
                    <input type="number" class="form-input" id="pPrice" placeholder="500000" min="0">
                </div>
                <div class="form-group full">
                    <label class="form-label">설명</label>
                    <textarea class="form-textarea" id="pDescription" placeholder="상품 설명..."></textarea>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">취소</button>
            <button class="btn btn-primary" onclick="saveProduct()">저장</button>
        </div>
    </div>
</div>

<style>
.ticket-kpi { background:#fff; border:1px solid var(--border); border-radius:8px; padding:12px 20px; min-width:110px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.04); }
.tkpi-v { font-size:22px; font-weight:700; color:var(--accent); }
.tkpi-l { font-size:12px; color:var(--text-muted); margin-top:2px; }
.pkg-component-box { display:flex; flex-direction:column; gap:8px; border:1px solid var(--border); border-radius:8px; padding:10px; }
.pkg-component-row { display:flex; align-items:center; gap:10px; font-size:13px; cursor:pointer; }
.pkg-component-name { font-weight:600; min-width:44px; }
.pkg-component-fields { display:flex; align-items:center; gap:6px; flex-wrap:wrap; color:var(--text-secondary); font-size:12px; }
.pkg-component-fields .form-input { width:70px; padding:5px 8px; font-size:12px; }
.component-badge { display:inline-block; padding:2px 7px; border-radius:5px; font-size:11px; font-weight:600; margin-right:4px; background:var(--surface-up); color:var(--text-secondary); }
</style>

<script>
let editingId = null;

function csrfHeaders(extra) { return Object.assign({ 'Content-Type': 'application/json' }, extra); }
function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toggleComponent(key) {
    const enabled = document.getElementById('c' + key + 'Enabled').checked;
    document.querySelectorAll(`[id^="c${key}"]:not([id$="Enabled"])`).forEach(el => el.disabled = !enabled);
}

async function loadProducts() {
    try {
        const res  = await fetch('/api/product-packages');
        const json = await res.json();
        const list = json.data || [];
        renderTable(list);
        updateSummary(list);
    } catch (e) {}
}

function updateSummary(list) {
    document.getElementById('kpiTotal').textContent    = list.length;
    document.getElementById('kpiActive').textContent   = list.filter(p => p.active).length;
    document.getElementById('kpiInactive').textContent = list.filter(p => !p.active).length;
}

function durationLabel(months, days) {
    const m = months || 0, d = days || 0;
    if (!m && !d) return '무제한';
    const parts = [];
    if (m) parts.push(m + '개월');
    if (d) parts.push(d + '일');
    return parts.join(' ');
}

function componentBadges(p) {
    const badges = [];
    if (p.membershipEnabled) badges.push(`<span class="component-badge">이용권 ${durationLabel(p.membershipDurationMonths, p.membershipDurationDays)}</span>`);
    if (p.ptEnabled) badges.push(`<span class="component-badge">PT ${p.ptSessionCount || 0}회</span>`);
    if (p.lockerEnabled) badges.push(`<span class="component-badge">락커 ${durationLabel(p.lockerDurationMonths, p.lockerDurationDays)}</span>`);
    if (p.uniformEnabled) badges.push(`<span class="component-badge">운동복 ${durationLabel(p.uniformDurationMonths, p.uniformDurationDays)}</span>`);
    return badges.join('') || '-';
}

function renderTable(list) {
    const tbody = document.getElementById('productTableBody');
    if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted)">상품 데이터가 없습니다.</td></tr>`;
        return;
    }
    tbody.innerHTML = list.map(p => `
        <tr>
            <td style="font-weight:500">${escHtml(p.name)}</td>
            <td style="font-size:12px">${componentBadges(p)}</td>
            <td style="color:var(--success);font-weight:600">${(p.price||0).toLocaleString()}원</td>
            <td><span class="badge ${p.active ? 'badge-active' : 'badge-expired'}">${p.active ? '노출' : '미노출'}</span></td>
            <td style="display:flex;gap:6px">
                <button class="btn btn-secondary" style="padding:5px 10px;font-size:12px" onclick="editProduct(${p.id})">수정</button>
                <button class="btn btn-danger"    style="padding:5px 10px;font-size:12px" onclick="deleteProduct(${p.id},'${(p.name||'').replace(/'/g,'')}')">삭제</button>
            </td>
        </tr>
    `).join('');
}

function resetComponentInputs() {
    ['Membership','Pt','Locker','Uniform'].forEach(key => {
        document.getElementById('c' + key + 'Enabled').checked = false;
        document.querySelectorAll(`[id^="c${key}"]:not([id$="Enabled"])`).forEach(el => { el.value = ''; el.disabled = true; });
    });
}

function openModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = '상품 등록';
    document.getElementById('pName').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pDescription').value = '';
    resetComponentInputs();
    document.getElementById('productModal').classList.add('open');
}
function closeModal() { document.getElementById('productModal').classList.remove('open'); }

async function editProduct(id) {
    const res  = await fetch(`/api/product-packages/${id}`);
    const json = await res.json();
    const p = json.data;
    editingId = id;
    document.getElementById('modalTitle').textContent = '상품 수정';
    document.getElementById('pName').value        = p.name || '';
    document.getElementById('pPrice').value       = p.price || 0;
    document.getElementById('pDescription').value = p.description || '';
    resetComponentInputs();
    if (p.membershipEnabled) {
        document.getElementById('cMembershipEnabled').checked = true;
        document.getElementById('cMembershipMonths').disabled = false;
        document.getElementById('cMembershipDays').disabled = false;
        document.getElementById('cMembershipMonths').value = p.membershipDurationMonths || '';
        document.getElementById('cMembershipDays').value = p.membershipDurationDays || '';
    }
    if (p.ptEnabled) {
        document.getElementById('cPtEnabled').checked = true;
        document.getElementById('cPtSessionCount').disabled = false;
        document.getElementById('cPtSessionCount').value = p.ptSessionCount || '';
    }
    if (p.lockerEnabled) {
        document.getElementById('cLockerEnabled').checked = true;
        document.getElementById('cLockerMonths').disabled = false;
        document.getElementById('cLockerDays').disabled = false;
        document.getElementById('cLockerMonths').value = p.lockerDurationMonths || '';
        document.getElementById('cLockerDays').value = p.lockerDurationDays || '';
    }
    if (p.uniformEnabled) {
        document.getElementById('cUniformEnabled').checked = true;
        document.getElementById('cUniformMonths').disabled = false;
        document.getElementById('cUniformDays').disabled = false;
        document.getElementById('cUniformMonths').value = p.uniformDurationMonths || '';
        document.getElementById('cUniformDays').value = p.uniformDurationDays || '';
    }
    document.getElementById('productModal').classList.add('open');
}

async function saveProduct() {
    const name  = document.getElementById('pName').value.trim();
    const price = parseInt(document.getElementById('pPrice').value) || 0;
    const description = document.getElementById('pDescription').value.trim();
    if (!name) { alert('상품명을 입력해주세요.'); return; }

    const membershipEnabled = document.getElementById('cMembershipEnabled').checked;
    const ptEnabled          = document.getElementById('cPtEnabled').checked;
    const lockerEnabled      = document.getElementById('cLockerEnabled').checked;
    const uniformEnabled     = document.getElementById('cUniformEnabled').checked;
    if (!membershipEnabled && !ptEnabled && !lockerEnabled && !uniformEnabled) {
        alert('이용권/PT/락커/운동복 중 하나 이상 선택해주세요.');
        return;
    }

    const body = {
        name, price, description, active: true,
        membershipEnabled,
        membershipDurationMonths: membershipEnabled ? (parseInt(document.getElementById('cMembershipMonths').value) || 0) : null,
        membershipDurationDays: membershipEnabled ? (parseInt(document.getElementById('cMembershipDays').value) || 0) : null,
        ptEnabled,
        ptSessionCount: ptEnabled ? (parseInt(document.getElementById('cPtSessionCount').value) || 0) : null,
        lockerEnabled,
        lockerDurationMonths: lockerEnabled ? (parseInt(document.getElementById('cLockerMonths').value) || 0) : null,
        lockerDurationDays: lockerEnabled ? (parseInt(document.getElementById('cLockerDays').value) || 0) : null,
        uniformEnabled,
        uniformDurationMonths: uniformEnabled ? (parseInt(document.getElementById('cUniformMonths').value) || 0) : null,
        uniformDurationDays: uniformEnabled ? (parseInt(document.getElementById('cUniformDays').value) || 0) : null,
    };
    const url    = editingId ? `/api/product-packages/${editingId}` : '/api/product-packages';
    const method = editingId ? 'PUT' : 'POST';
    const res  = await fetch(url, { method, headers: csrfHeaders(), body: JSON.stringify(body) });
    const json = await res.json();
    if (!json.success) { alert(json.message || '저장에 실패했습니다.'); return; }
    closeModal();
    loadProducts();
}

async function deleteProduct(id, name) {
    if (!confirm(`${name} 상품을 삭제하시겠습니까?`)) return;
    await fetch(`/api/product-packages/${id}`, { method: 'DELETE', headers: csrfHeaders() });
    loadProducts();
}

function openSidebar() {
    document.querySelector('.sidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebar() {
    document.querySelector('.sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
}

loadProducts();
</script>
</body>
</html>
